name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Render preview (smoke test)
        run: |
          .build/release/agentbar render --multi --out /tmp/preview.png
          test -s /tmp/preview.png
